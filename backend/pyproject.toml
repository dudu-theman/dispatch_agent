[project]
name = "dispatch-agent"
version = "0.1.0"
description = "Conversational intake agent that turns home-service requests into dispatchable leads."
authors = [
    { name = "dudu-theman", email = "dustanley07@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "anthropic>=1.12.1",
]

[build-system]
requires = ["uv_build>=0.10.8,<0.11.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
namespace = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # line length is handled by ruff format

[tool.pytest.ini_options]
# Live LLM tests cost money: run them with `uv run pytest -m llm`.
addopts = "-m 'not llm'"
markers = ["llm: calls the real Claude API"]
